<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" role="img" aria-labelledby="title desc">
  <title id="title">Vimlendu Sharma — Software Engineer</title>
  <desc id="desc">Premium engineering profile banner. Decorative network diagram has a restrained pulse animation and remains readable without motion.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0C1422" />
      <stop offset="1" stop-color="#13263C" />
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#75D8EB"/>
      <stop offset="1" stop-color="#2F94B1" stop-opacity="0.15" />
    </linearGradient>
    <pattern id="microgrid" width="23" height="23" patternUnits="userSpaceOnUse">
      <path d="M 23 0 L 0 0 0 23" fill="none" stroke="#24405A" stroke-width="0.6" opacity="0.36" />
    </pattern>
    <clipPath id="round"><rect x="1" y="1" width="1198" height="288" rx="22"/></clipPath>
  </defs>
  <style>
    .pulse { transform-box: fill-box; transform-origin: center; animation: softpulse 4.8s ease-in-out infinite; }
    .trace { stroke-dasharray: 4 10; animation: trace 14s linear infinite; }
    @keyframes softpulse { 0%, 100% { opacity:.16; transform:scale(.82); } 50% { opacity:.42; transform:scale(1.16); } }
    @keyframes trace { to { stroke-dashoffset: -84; } }
    @media (prefers-reduced-motion: reduce) { .pulse, .trace { animation: none !important; } }
  </style>
  <g clip-path="url(#round)">
    <rect width="1200" height="290" fill="url(#background)"/>
    <rect x="825" y="0" width="375" height="290" fill="url(#microgrid)"/>
    <path d="M 0 272 H 1200" stroke="#2A4860" opacity=".3"/>
    <path d="M 770 0 L 670 290" stroke="#22506B" opacity=".23"/>
    <rect x="44" y="40" width="5" height="200" rx="2.5" fill="#75D8EB" opacity=".9"/>
    <text x="77" y="62" fill="#75D8EB" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="3">ENGINEERING  /  SOFTWARE</text>
    <text x="74" y="130" fill="#F7FBFF" font-family="Arial, Helvetica, sans-serif" font-size="53" font-weight="700" letter-spacing=".25">VIMLENDU SHARMA</text>
    <text x="77" y="170" fill="#B7CADB" font-family="Arial, Helvetica, sans-serif" font-size="23">Backend systems  ·  Applications  ·  Applied AI</text>
    <rect x="77" y="192" width="405" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="77" y="224" fill="#7B99AA" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="1.7">BUILD  ·  TEST  ·  UNDERSTAND</text>
    <text x="78" y="267" fill="#7B99AA" font-family="monospace" font-size="13">github.com/VimlenduSharma</text>
    <!-- Abstract engineering graph: decorative, not an architecture claim. -->
    <g fill="none" stroke="#2C617A" stroke-width="2">
      <path d="M 889 90 L 1020 58 L 1116 112 L 1060 220 L 920 212 Z"/>
      <path d="M 889 90 L 1000 151 L 1020 58 M 1000 151 L 1116 112 M 1000 151 L 1060 220 M 920 212 L 1000 151"/>
      <path class="trace" d="M 845 150 L 1155 150" opacity=".68" stroke="#75D8EB" stroke-width="1.25"/>
    </g>
    <circle cx="1000" cy="151" r="69" fill="none" stroke="#22506B" opacity=".35"/>
    <circle cx="1000" cy="151" r="43" fill="#3AA8BA" opacity=".09"/>
    <circle cx="1000" cy="151" r="34" fill="#3AA8BA" class="pulse"/>
    <circle cx="1000" cy="151" r="16" fill="#3AA8BA" opacity=".78"/>
    <path d="M 992 151 L 998 157 L 1009 145" fill="none" stroke="#0C1422" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#0C1422" stroke="#3AA8BA" stroke-width="2.5">
      <circle cx="889" cy="90" r="9"/><circle cx="1020" cy="58" r="9"/>
      <circle cx="1116" cy="112" r="9"/><circle cx="1060" cy="220" r="9"/>
      <circle cx="920" cy="212" r="9"/>
    </g>
    <rect x="1094" y="238" width="74" height="24" rx="12" fill="#132C43" stroke="#1E455B"/>
    <circle cx="1110" cy="250" r="4" fill="#3AA8BA"/>
    <text x="1122" y="254" fill="#B7CADB" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">CODE</text>
  </g>
  <rect x="1" y="1" width="1198" height="288" rx="22" fill="none" stroke="#2A4860" stroke-width="2" />
</svg>